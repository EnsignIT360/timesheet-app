services:
  backend:
    build: ./backend
    container_name: timesheet-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_ORIGIN: http://localhost:3000

  frontend:
    build: ./frontend
    container_name: timesheet-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
