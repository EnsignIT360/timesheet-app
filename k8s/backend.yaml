apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesheet-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timesheet-backend
  template:
    metadata:
      labels:
        app: timesheet-backend
    spec:
      containers:
        - name: backend
          image: timesheet-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: timesheet-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
