apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: timesheet
resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
images:
  - name: timesheet-backend
    newName: us-central1-docker.pkg.dev/PROJECT_ID/timesheets/timesheet-backend
    newTag: latest
  - name: timesheet-frontend
    newName: us-central1-docker.pkg.dev/PROJECT_ID/timesheets/timesheet-frontend
    newTag: latest
